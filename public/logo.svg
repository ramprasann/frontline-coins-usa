<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1d44"/>
      <stop offset="100%" stop-color="#050c20"/>
    </linearGradient>
    <linearGradient id="silverRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rim with serrations / milled edge -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#coinGrad)" stroke-width="3.5" stroke-dasharray="2, 3" />
  
  <!-- Outer Solid Ring -->
  <circle cx="60" cy="60" r="52" fill="url(#shieldGrad)" stroke="url(#coinGrad)" stroke-width="2.5" filter="url(#coinShadow)"/>
  
  <!-- Inner Beaded Ring -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1.5, 2" opacity="0.8"/>
  
  <!-- Star Cluster at Top -->
  <g fill="#ffffff">
    <polygon points="60,17 61.5,21.5 66,21.5 62.5,24 64,28.5 60,26 56,28.5 57.5,24 54,21.5 58.5,21.5" transform="scale(0.7) translate(25.7, 7)"/>
    <polygon points="48,22 49,25 52,25 49.5,27 50.5,30 48,28.5 45.5,30 46.5,27 44,25 47,25" transform="scale(0.5) translate(48, 18)"/>
    <polygon points="72,22 73,25 76,25 73.5,27 74.5,30 72,28.5 69.5,30 70.5,27 68,25 71,25" transform="scale(0.5) translate(48, 18)"/>
  </g>

  <!-- Police / First Responder Shield in Center -->
  <path d="M60 30 C74 30 84 34 84 48 C84 68 60 85 60 85 C60 85 36 68 36 48 C36 34 46 30 60 30 Z" 
        fill="url(#shieldGrad)" stroke="url(#coinGrad)" stroke-width="2" />
        
  <!-- Eagle Crest Silhouette Inside Shield -->
  <path d="M60 41 L63 46 L68 47 L64.5 50.5 L65.5 55.5 L60 52.5 L54.5 55.5 L55.5 50.5 L52 47 L57 46 Z" fill="url(#coinGrad)"/>
  
  <!-- Crossed Laurels / Arrows -->
  <path d="M46 64 C50 67 55 69 60 70 C65 69 70 67 74 64" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 61 L60 72 L70 61" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>

  <!-- Text Arc / Ribbon -->
  <path id="textPathTop" d="M 22,60 A 38,38 0 0,1 98,60" fill="none" />
  <path id="textPathBottom" d="M 98,60 A 38,38 0 0,1 22,60" fill="none" />
  
  <text font-family="'Cinzel', Georgia, serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      FRONTLINE
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#cbd5e1" letter-spacing="1.8">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      COINS USA
    </textPath>
  </text>
  
  <!-- Subtle center star -->
  <circle cx="60" cy="74" r="1.5" fill="#ffffff"/>
</svg>
